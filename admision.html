            <h2 style="color: #1a365d; text-align: center; margin-bottom: 20px;">Solicitud de Vacante y Admisión</h2>
            <form action="#" method="POST" onsubmit="alert('Solicitud enviada correctamente. La secretaría se comunicará a la brevedad.'); return false;">
                <div class="form-group">
                    <label>Nombre Completo del Apoderado:</label>
                    <input type="text" required placeholder="Ej. Juan Carlos Quispe">

                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" required placeholder="correo@ejemplo.com">

                <div class="form-group">
                    <label>Teléfono de Contacto:</label>
                    <input type="text" required placeholder="Ej. 984123456">

                <div class="form-group">
                    <label>Nivel de Postulación:</label>
                    <select required>
                        <option value="">Seleccione el nivel...</option>
                        <option value="Inicial">Inicial</option>
                        <option value="Primaria">Primaria</option>
                        <option value="Secundaria">Secundaria</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Grado al que postula:</label>
                    <input type="text" required placeholder="Ej. 1° de Primaria">
                </div>
                <div class="form-group">
                    <label>Mensaje o Consulta:</label>
                    <textarea rows="4" placeholder="Indique si procede de otro colegio o requiere información adicional"></textarea>
                </div>
                <button type="submit" class="btn-primary">Enviar Solicitud de Vacante</button>
            </form>
